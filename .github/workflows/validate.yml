name: Validate Claude plugin

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and synchronized versions
        run: |
          jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json >/dev/null
          plugin_version="$(jq -r '.version' .claude-plugin/plugin.json)"
          marketplace_version="$(jq -r '.plugins[] | select(.name == "hrg-flowfield") | .version' .claude-plugin/marketplace.json)"
          test "$plugin_version" = "$marketplace_version"
      - name: Test installer
        run: sh tests/test-install-claude-code.sh
      - name: Test release packaging
        run: |
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          mkdir -p "$RUNNER_TEMP/dist"
          scripts/package-release.sh "$version" "$RUNNER_TEMP/dist" >"$RUNNER_TEMP/dist/SHA256SUMS"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 -c SHA256SUMS
      - name: Publish versioned fallback release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.HRG_FLOWFIELD_PLUGIN_PUBLISH_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; no release required."
            exit 0
          fi
          git config user.name "flowfield-release-bot"
          git config user.email "release-bot@flowfield.inc"
          git tag -a "$tag" -m "HRG Flowfield $tag"
          git push origin "$tag"
          scripts/package-release.sh "$version" "$RUNNER_TEMP/dist" >"$RUNNER_TEMP/dist/SHA256SUMS"
          gh release create "$tag" "$RUNNER_TEMP/dist/hrg-flowfield-v$version.plugin" "$RUNNER_TEMP/dist/hrg-flowfield-v$version.zip" "$RUNNER_TEMP/dist/SHA256SUMS" \
            --title "HRG Flowfield $tag" \
            --notes "Automated release from the canonical flowfieldai/flowfield plugin source."
